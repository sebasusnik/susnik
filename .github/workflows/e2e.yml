name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json's engines and Vercel's builds are on 22; .nvmrc still
          # says 18 and is not what production runs.
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint errors and unformatted code fail the build; the warnings are the
      # terminal's, tracked apart.
      - run: npx biome ci --reporter=github .
      # astro:content types live in .astro/, which is gitignored.
      - run: npx astro sync
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
